<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Управление сборкой — МОД:ЛАБ</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<header id="site-header" class="site-header"></header>

<div class="wrap section" style="max-width:760px">
  <div class="section-head"><h2>Управление сборкой</h2></div>

  <div class="panel" id="token-gate">
    <div class="form-row">
      <label>ID сборки</label>
      <input type="text" id="gate-id" placeholder="Например: 4">
    </div>
    <div class="form-row">
      <label>Код управления</label>
      <input type="text" id="gate-token" placeholder="Код, выданный при публикации">
    </div>
    <button class="btn btn-ember btn-block" id="gate-btn">Открыть управление</button>
  </div>

  <div id="edit-area" style="display:none">
    <form class="panel" id="edit-form" enctype="multipart/form-data">
      <div class="form-row">
        <label>Название</label>
        <input type="text" id="e-title" required maxlength="120">
      </div>
      <div class="two-col">
        <div class="form-row">
          <label>Автор</label>
          <input type="text" id="e-author" maxlength="60">
        </div>
        <div class="form-row">
          <label>Теги (через запятую)</label>
          <input type="text" id="e-tags">
        </div>
      </div>
      <div class="form-row">
        <label>Описание</label>
        <textarea id="e-description" style="min-height:130px"></textarea>
      </div>
      <div class="form-row">
        <label>Новая обложка (необязательно)</label>
        <input type="file" id="e-cover" accept="image/*">
      </div>
      <div class="form-row">
        <label>Состав сборки</label>
        <div class="mod-pick-list" id="mod-pick-list"></div>
        <div class="hint">Минимум 2 мода. Можно снять/добавить моды из той же игры.</div>
      </div>
      <button type="submit" class="btn btn-ember btn-block">Сохранить изменения</button>
    </form>

    <div class="panel" style="border-color:var(--danger)">
      <h3 style="font-size:16px;margin-bottom:10px;color:var(--danger)">Опасная зона</h3>
      <p style="color:var(--text-muted); font-size:13.5px; margin-bottom:14px">Удаление сборки необратимо. Сами моды внутри неё удалены не будут.</p>
      <button class="btn btn-danger" id="delete-btn">Удалить сборку навсегда</button>
    </div>
  </div>
</div>

<footer id="site-footer" class="site-footer"></footer>

<script src="/js/app.js"></script>
<script src="/js/bundle-edit.js"></script>
</body>
</html>
